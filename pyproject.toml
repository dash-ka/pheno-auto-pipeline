[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pheno-auto-pipeline"
version = "0.2.0"
description = "Patient-level HPO phenotype extraction from case reports: LLM extraction of text and tables, BeLink grounding, LLM patient merging, review app"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Darya Shlyk" }]
dependencies = [
    # BeLink: SapBERT retrieval + Qwen3-4B LoRA re-ranker (brings torch, transformers, peft, accelerate);
    # the commit of run50. Exact versions of run50: requirements/belink-run50.txt
    "belink-hpo @ git+https://github.com/dash-ka/BeLink-HPO.git@af084c7a232f02ecc3f29531d120af0b183327cf",
]

[project.optional-dependencies]
# prepare-sections: supplementary .xlsx / .xls / .pdf files (.doc/.rtf also need LibreOffice's soffice)
sections = ["openpyxl", "xlrd", "pdfplumber"]
test = ["pytest"]

[project.scripts]
pheno-auto = "pheno_auto.cli:main"

[project.urls]
Repository = "https://github.com/Dash00/pheno-auto-pipeline"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pheno_auto = ["steps/*.py", "viewer/*.html"]
